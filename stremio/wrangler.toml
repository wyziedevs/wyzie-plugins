name            = "wyzie-stremio"
main            = "worker.js"
account_id      = "41693b70cad8d2ae3d3e348d373df7d6"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bind stremio.wyzie.io to this worker (provisions DNS + cert on the wyzie.io
# zone). The store /plugins page + docs link to https://stremio.wyzie.io/configure.
[[routes]]
pattern = "stremio.wyzie.io"
custom_domain = true

# The user's API key rides in every request path (/<config>/...) and in the
# /search subrequest URL, so per-request invocation logs and traces would store
# it in Workers Logs. Both stay off; console output (the worker logs no keys)
# is still collected, sampled at 10%.
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false
